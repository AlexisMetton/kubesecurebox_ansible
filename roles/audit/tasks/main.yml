# Role: audit
# Description: Installation de Lynis et scan automatique
# =======================================================
---
# === INSTALLATION LYNIS ===
# Utilise le paquet Lynis des depots Debian (pas besoin de depot externe)
- name: Installer Lynis depuis les depots Debian
  apt:
    name: lynis
    state: present
    update_cache: yes

# === CONFIGURATION ===
- name: Creer le repertoire pour les rapports Lynis
  file:
    path: /var/log/lynis
    state: directory
    mode: '0750'
    owner: root
    group: root

# === SCRIPT DE SCAN AUTOMATIQUE ===
- name: Creer le script de scan Lynis
  template:
    src: lynis-scan.sh.j2
    dest: /usr/local/bin/lynis-scan.sh
    mode: '0750'
    owner: root
    group: root

# === CRON JOB HEBDOMADAIRE ===
- name: Configurer le scan Lynis hebdomadaire (dimanche 3h)
  cron:
    name: "Lynis security audit"
    minute: "0"
    hour: "3"
    weekday: "0"
    job: "/usr/local/bin/lynis-scan.sh"
    user: root

# === PREMIER SCAN ===
- name: Executer un premier scan Lynis
  command: lynis audit system --quick --no-colors
  register: lynis_result
  changed_when: false
  ignore_errors: yes

- name: Afficher le score Lynis
  debug:
    msg: "Scan Lynis termine. Verifiez /var/log/lynis/ pour les details."
